name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test and lint
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install the check tools
        run: pacman -Syu --noconfirm --needed git cmake ninja clang llvm wayland-protocols typos nodejs npm

      - name: Build xunused
        run: |
          git clone https://github.com/mgehre/xunused.git /tmp/xunused
          git -C /tmp/xunused checkout b81e0ef
          if [[ ! -f /usr/include/clang/Driver/Options.h ]]; then
            sed -i 's|#include "clang/Driver/Options.h"|#include "clang/Options/Options.h"|' /tmp/xunused/main.cpp
          fi
          cmake -S /tmp/xunused -B /tmp/xunused/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/xunused/build
          install -Dm755 /tmp/xunused/build/xunused /usr/local/bin/xunused

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Konveyor's dependencies
        run: extras/packaging/dependencies.sh

      - name: Run the full check suite
        run: ./tools/check.sh

  sanitizers:
    name: Layout tests under sanitizers
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed git cmake ninja wayland-protocols

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Konveyor's dependencies
        run: extras/packaging/dependencies.sh

      - name: Run the layout tests with AddressSanitizer, UndefinedBehaviorSanitizer and libstdc++ assertions
        run: ./tools/sanitize.sh layout

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install the coverage and nested session tools
        run: >-
          pacman -Syu --noconfirm --needed git cmake ninja clang llvm wayland-protocols dbus mesa xorg-xwayland qt6-wayland qt6-declarative
          python python-dbus python-gobject python-pillow python-xlib plasma-workspace plasma-keyboard breeze libkscreen kcmutils chromium

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Konveyor's dependencies
        run: extras/packaging/dependencies.sh

      - name: Measure coverage of the unit and nested KWin tests and check it against tests/coverage/thresholds.json
        run: |
          useradd -m tester
          chown -R tester: "$GITHUB_WORKSPACE"
          install -d -m 700 -o tester /tmp/runtime-tester
          runuser -u tester -- env XDG_RUNTIME_DIR=/tmp/runtime-tester HOME=/home/tester ./tools/coverage.sh --nested

      - name: Publish the coverage summary
        if: always() && hashFiles('build-coverage/coverage/summary.md') != ''
        run: cat build-coverage/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always() && hashFiles('build-coverage/coverage/summary.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-coverage/coverage/html
            build-coverage/coverage/summary.md
            build-coverage/coverage/cpp.json
            build-coverage/coverage/python.json

  nested:
    name: Nested KWin tests
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install the nested session tools
        run: >-
          pacman -Syu --noconfirm --needed git cmake ninja wayland-protocols dbus mesa xorg-xwayland qt6-wayland qt6-declarative
          python python-dbus python-gobject python-pillow python-xlib plasma-workspace plasma-keyboard breeze libkscreen kcmutils chromium

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Konveyor's dependencies
        run: extras/packaging/dependencies.sh

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build

      - name: Run the nested KWin tests as a normal user
        run: |
          useradd -m tester
          chown -R tester: "$GITHUB_WORKSPACE"
          install -d -m 700 -o tester /tmp/runtime-tester
          runuser -u tester -- env XDG_RUNTIME_DIR=/tmp/runtime-tester HOME=/home/tester \
            ctest --test-dir build -L nested --output-on-failure -j2

  distros:
    name: Install dependencies and build on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SteamOS 3.9
            image: archlinux:latest
            plasma: |
              repos="jupiter-3.9 holo-3.9 core-3.9 extra-3.9 multilib-3.9"
              conf() {
                printf '[options]\nArchitecture = auto\nSigLevel = %s\nLocalFileSigLevel = Optional\n' "$1"
                for repo in $repos; do printf '[%s]\nServer = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch\n' "$repo"; done
              }
              conf Never > /etc/pacman-bootstrap.conf
              pacman -Sy --noconfirm --config /etc/pacman-bootstrap.conf holo-keyring
              pacman-key --init
              pacman-key --populate archlinux holo
              conf "Required DatabaseOptional" > /etc/pacman.conf
              pacman -Syuu --noconfirm --ignore filesystem
              pacman -S --noconfirm --needed git plasma-desktop
          - name: Fedora 44
            image: fedora:44
            plasma: dnf install -y git plasma-desktop
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            plasma: zypper --non-interactive dup --allow-downgrade && zypper --non-interactive install --force-resolution git plasma6-desktop
          - name: Debian testing
            image: debian:testing
            plasma: apt-get update && apt-get install -y git plasma-desktop
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Plasma
        run: ${{ matrix.plasma }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Konveyor's dependencies
        run: extras/packaging/dependencies.sh

      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DKONVEYOR_BUILD_TESTS=OFF
          cmake --build build
          DESTDIR="$PWD/staging" cmake --install build
          find staging -path '*/kwin/effects/plugins/konveyor_effect.so' | grep .
          find staging -path '*/plasma/kcms/systemsettings/kcm_konveyor.so' | grep .

  install:
    name: Install, check and uninstall on Arch Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install, check and uninstall Konveyor in a Plasma session
        run: tests/install/run.sh

  release:
    name: Release
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Create the source archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          tools/source-archive.sh "$version"
          sha256sum "konveyor-${version}.tar.gz" > "konveyor-${version}.tar.gz.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            konveyor-*.tar.gz
            konveyor-*.tar.gz.sha256
          body: |
            ## Install

            Konveyor is built against the exact KWin version on your machine, so install it from source:

            ```sh
            git clone --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git
            cd Konveyor
            ./install.sh
            ```

            Log out and back in, then press Super+K for the shortcut list.

            Updating from an older version is the same command: `./install.sh`. To remove it, run `./uninstall.sh`.

            The attached archive is the same source tree for offline installs.
