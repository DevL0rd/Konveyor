<style>
.in,.out{transform-box:fill-box;transform-origin:center;animation:talk 1.5s ease-in-out infinite}
.out{animation-duration:1.5s}
@keyframes talk{0%,100%{transform:scaleY(.3)}35%{transform:scaleY(1)}60%{transform:scaleY(.55)}80%{transform:scaleY(.9)}}
.glow{transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}
.ph{opacity:0;animation:phase 12s linear infinite both}
@keyframes phase{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
.dot{animation:travel 1.5s linear infinite}
@keyframes travel{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(96px);opacity:0}}
.title{font:800 56px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:-2px}
.sub{font:500 25px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.pill{font:600 17px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.chip{font:600 18px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.tag{font:700 13px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:2px}
</style></defs>
