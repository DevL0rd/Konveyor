@keyframes scrB{0%{opacity:0}30%{opacity:1}80%{opacity:0}}
.usb{animation:usb 10s ease-in-out infinite}.air{animation:air 10s ease-in-out infinite}
@keyframes usb{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes air{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.wave{animation:wave 1.8s ease-out infinite;transform-origin:1168px 150px;transform-box:view-box}
.wave2{animation-delay:.6s}.wave3{animation-delay:1.2s}
@keyframes wave{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

